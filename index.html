<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Halftone Lens</title>
    <meta name="description" content="An interactive visual toy rendering dynamic typography in halftone dot fields and real-time ASCII physics lens." />
    <meta name="theme-color" content="#EFEBE3" />
    <meta property="og:title" content="Halftone Lens" />
    <meta property="og:description" content="Interactive visual toy blending halftone typography and ASCII physics lens." />
    <meta property="og:type" content="website" />
    
    <!-- Favicon: Single elegant halftone dot SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141311'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23EFEBE3'/%3E%3C/svg%3E" />

    <!-- 1. Instant Theme Resolution before First Paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var themeIdx = saved !== null ? parseInt(saved, 10) : 0;
          if (themeIdx >= 0 && themeIdx <= 2) {
            document.documentElement.dataset.theme = themeIdx;
            var bgColors = ['#EFEBE3', '#0E0E0D', '#C8F135'];
            var bg = bgColors[themeIdx];
            document.documentElement.style.backgroundColor = bg;
            document.documentElement.style.background = bg;
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', bg);
          }
        } catch (e) {}
      })();
    </script>

    <!-- 2. Critical Inline CSS: Prevents FOUC and sets zero-flash baseline -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background-color: #EFEBE3;
        overflow: hidden;
      }
      html[data-theme="1"], body[data-theme="1"] {
        background-color: #0E0E0D;
      }
      html[data-theme="2"], body[data-theme="2"] {
        background-color: #C8F135;
      }
      .mobile-input,
      .visually-hidden {
        position: fixed;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
        left: -9999px;
        font-size: 16px;
      }
      html:not(.ready) .dock-container,
      html:not(.ready) .dock-pill,
      html:not(.ready) .hint,
      html:not(.ready) .brand,
      html:not(.ready) canvas,
      html:not(.ready) #gl-canvas {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      .dock-container, .dock-pill, .hint, .brand, canvas, #gl-canvas {
        transition: opacity 300ms ease;
      }
    </style>

    <!-- 3. NoScript Failsafe -->
    <noscript>
      <style>
        .dock-container, .dock-pill, .hint, .brand, canvas, #gl-canvas {
          opacity: 1 !important;
          visibility: visible !important;
        }
      </style>
    </noscript>

    <!-- 4. Render-blocking External Stylesheet Link -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Fullscreen WebGL2 Rendering Canvas -->
    <canvas id="gl-canvas" role="img" aria-label="DODO"></canvas>

    <!-- WebGL2 Unsupported Graceful Fallback -->
    <div id="no-webgl" class="fallback-screen" hidden>
      <div class="fallback-content">
        <h1 id="fallback-word" class="fallback-text">DODO</h1>
        <p class="fallback-note">WebGL2 is not supported on this browser/device. Halftone rendering requires WebGL2.</p>
      </div>
    </div>

    <!-- UI Chrome: Header Elements -->
    <header class="ui-header" aria-label="Header controls">
      <div class="brand" id="brand-wordmark">Halftone Lens</div>
      <button type="button" class="hint" id="type-hint" aria-label="Type to change text (tap to open keyboard)">
        <span class="hint-prompt" id="hint-prompt">
          <span class="hint-text">Type anything</span>
          <span class="blinking-caret" aria-hidden="true"></span>
        </span>
        <span class="char-counter" id="char-counter" aria-live="polite">4/40</span>
      </button>
    </header>

    <!-- Hidden Input for Virtual Mobile Keyboards -->
    <label for="mobile-text-input" class="visually-hidden">Current Word</label>
    <input
      type="text"
      id="mobile-text-input"
      class="mobile-input"
      aria-hidden="true"
      tabindex="-1"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      maxlength="40"
      value="DODO"
    />

    <!-- UI Chrome: Floating Dock Controls -->
    <nav class="dock-container" id="dock-container" aria-label="Halftone Lens settings">
      <div class="dock-pill" id="dock-pill">
        
        <!-- Cell Size Control -->
        <div class="control-group">
          <label for="cell-slider" class="micro-label">CELL <span id="cell-val" class="num-val">11</span></label>
          <input
            type="range"
            id="cell-slider"
            class="range-input"
            min="6"
            max="24"
            step="1"
            value="11"
            aria-label="Grid cell size in pixels"
          />
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Lens Radius Control -->
        <div class="control-group">
          <label for="lens-slider" class="micro-label">LENS <span id="lens-val" class="num-val">130</span></label>
          <input
            type="range"
            id="lens-slider"
            class="range-input"
            min="80"
            max="220"
            step="5"
            value="130"
            aria-label="Lens radius in pixels"
          />
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Theme Selector Dots -->
        <div class="theme-group" role="radiogroup" aria-label="Color theme">
          <button
            type="button"
            class="theme-dot active"
            data-theme="0"
            id="theme-btn-0"
            role="radio"
            aria-checked="true"
            aria-label="Theme 1: Paper"
            title="Theme 1: Paper (Alt+1)"
          >
            <span class="dot-swatch paper-swatch"></span>
          </button>
          <button
            type="button"
            class="theme-dot"
            data-theme="1"
            id="theme-btn-1"
            role="radio"
            aria-checked="false"
            aria-label="Theme 2: Night"
            title="Theme 2: Night (Alt+2)"
          >
            <span class="dot-swatch night-swatch"></span>
          </button>
          <button
            type="button"
            class="theme-dot"
            data-theme="2"
            id="theme-btn-2"
            role="radio"
            aria-checked="false"
            aria-label="Theme 3: Lime"
            title="Theme 3: Lime (Alt+3)"
          >
            <span class="dot-swatch lime-swatch"></span>
          </button>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Export PNG Button -->
        <button
          type="button"
          class="action-btn"
          id="export-btn"
          aria-label="Save image as PNG (Alt+S)"
          title="Save PNG (Alt+S)"
        >
          <svg class="btn-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span class="btn-label">PNG</span>
        </button>

      </div>
    </nav>

    <!-- Application Main Script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
